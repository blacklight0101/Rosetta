# Hooks help; CI is the gate (environments-and-delivery.md section 5).
# Humans get the hooks from `npm run hooks:install` (its postinstall also installs them).
# Agents install with `npm ci --ignore-scripts`: worktrees share one .git/hooks directory, so hooks
# written from one worktree would run in every other. LEFTHOOK=0 does not stop the postinstall
# (lefthook 2.2 skips it only when CI is set and LEFTHOOK is not); only lefthook, the macOS-only
# fsevents and tree-sitter-c-sharp (node-gyp-build, which only finds its shipped prebuild) have install
# scripts (tests/integration/tooling/lefthook-install.test.ts). CI runners set
# CI=true, which makes the postinstall skip writing hooks; a plain `npm ci` also installs them through
# lefthook's postinstall.
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,mjs,cjs,json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,mjs}'
      run: npx eslint --max-warnings 0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    # The unit, web and documentation tests the push needs (scripts/pre-push-tests.mjs); CI runs every test.
    tests:
      run: node scripts/pre-push-tests.mjs
