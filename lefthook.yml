# Hooks help; CI is the gate (environments-and-delivery.md section 5).
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,mjs,cjs,json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,mjs}'
      run: npx eslint --max-warnings 0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    unit:
      run: npx vitest run --project unit
