# Hooks help; CI is the gate (environments-and-delivery.md section 5).
# Humans get the hooks from `npm run hooks:install` (its postinstall also installs them).
# Agents install with `npm ci --ignore-scripts`: worktrees share one .git/hooks directory, so hooks
# written from one worktree would run in every other. LEFTHOOK=0 does not stop the postinstall
# (lefthook 2.2 skips it only when CI is set and LEFTHOOK is not); only lefthook and the macOS-only
# fsevents have install scripts (tests/integration/tooling/lefthook-install.test.ts). CI runners set
# CI=true, so a plain `npm ci` there writes no hooks.
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,mjs,cjs,json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,mjs}'
      run: npx eslint --max-warnings 0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    unit:
      run: npx vitest run --project unit
