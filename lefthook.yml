# Hooks help; CI is the gate (environments-and-delivery.md section 5).
# Humans get the hooks from `npm run hooks:install` (its postinstall also installs them).
# Agents and CI install with LEFTHOOK=0 (`LEFTHOOK=0 npm ci`): worktrees share one .git/hooks
# directory, so hooks written from one worktree would run in every other.
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,mjs,cjs,json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,mjs}'
      run: npx eslint --max-warnings 0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    unit:
      run: npx vitest run --project unit
