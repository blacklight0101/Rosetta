name: Bug
description: Something Rosetta does that it should not
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command, configuration (without keys) and output
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rosetta version and Node.js version
