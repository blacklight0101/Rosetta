name: Task card
description: One build task from docs/orchestration/tasks.md
title: "P<phase>-<nn>: <title>"
labels: ["task"]
body:
  - type: input
    id: card
    attributes:
      label: Card id
      description: The card id in docs/orchestration/tasks.md, for example P1-03
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty (DEC-32)
      options: ["1 (haiku)", "2 (haiku)", "3 (haiku)", "4 (sonnet)", "5 (sonnet)", "6 (sonnet)", "7 (opus)", "8 (opus)", "9 (opus)", "10 (fable)"]
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Implements
      description: RF, RNF, ADR and DEC ids
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Copied from the card's done-when checks
    validations:
      required: true
