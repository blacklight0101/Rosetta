# Weekly updates for npm packages and GitHub Actions, minor and patch grouped (DEC-42).
# Commit messages use a lower-case Conventional Commits prefix so pull request titles pass commitlint
# (the pr-title check): "build(deps): bump ..." for npm and "ci(deps): bump ..." for actions.
# A version is proposed only once it is two weeks old (DEC-125), through the cooldown of each entry.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Revisit when typescript-eslint, knip and dependency-cruiser support TypeScript 7
      # (typescript-eslint 8.71 peers typescript ">=4.8.4 <6.1.0"; TS 7 ships no JS compiler API yet).
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # @types/node follows the Node runtime major in .nvmrc (24); a higher major describes APIs the runtime lacks.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # The Anthropic SDK stays on the exact pin chosen for P2-09; card P2-17 moves it by hand (DEC-125).
      - dependency-name: '@anthropic-ai/sdk'
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
