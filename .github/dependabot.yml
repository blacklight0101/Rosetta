# Weekly updates for npm packages, GitHub Actions and the Dockerfile base image (DEC-42, DEC-252).
# Commit messages use a lower-case Conventional Commits prefix so pull request titles pass commitlint
# (the pr-title check): "build(deps): bump ..." for npm runtime packages, "build(deps-dev): bump ..." for
# npm development packages and "ci(deps): bump ..." for actions.
# A version is proposed only once it is two weeks old (DEC-125), through the cooldown of each entry.
# The cooldown does not delay security updates, so a fix for an advisory is proposed at once (DEC-169).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Revisit when typescript-eslint, knip and dependency-cruiser support TypeScript 7
      # (typescript-eslint 8.71 peers typescript ">=4.8.4 <6.1.0"; TS 7 ships no JS compiler API yet).
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # @types/node follows the Node runtime major in .nvmrc (24); a higher major describes APIs the runtime lacks.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # The Anthropic SDK stays on the exact pin chosen for P2-09; card P2-17 moves it by hand (DEC-125).
      - dependency-name: '@anthropic-ai/sdk'
      # Held until the code they flag is fixed (#1434, DEC-252): 8.72 reports six deprecated options
      # as errors, and axe-core 4.14 reports label-content-name-mismatch on the code map and transcript links.
      # Remove each entry in the change that fixes its findings.
      - dependency-name: typescript-eslint
        versions: ['>=8.72.0']
      - dependency-name: '@axe-core/playwright'
        versions: ['>=4.14.0']
    groups:
      # Runtime and development packages are grouped apart, so a development tool that fails CI
      # never holds back a runtime fix (DEC-252). Major versions still arrive one pull request each.
      npm-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Security updates for npm come as one pull request (DEC-169).
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
  # The base image of the Dockerfile is pinned by digest; a newer digest is proposed after the cooldown.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The image follows the Node runtime major in .nvmrc and package.json engines (24, ">=24.11.0 <25").
      - dependency-name: node
        versions: ['>=25']
