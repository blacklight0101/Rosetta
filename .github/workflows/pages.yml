# Pages (RF-800, RF-501, DEC-04, DEC-105): publishes the sample report in `site/` from `main` to GitHub
# Pages, then checks that the published index shows the sample run (scripts/pages-smoke.mjs). Nothing
# is published from a pull request. Three jobs: build reads the repository (contents: read only),
# deploy holds the two write scopes Pages needs and nothing else, and smoke checks the public address.
# The owner enables Pages with the source "GitHub Actions" in the repository settings; this file
# changes no setting. Until the owner does, the first run on main is red at configure-pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
      - scripts/pages-smoke.mjs
      - src/infrastructure/report/index-check.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The run key of the sample in site/ (scripts/build-sample-site.mjs); the smoke step looks for it.
  SAMPLE_RUN_KEY: 20261012-100000-understand

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check that the published index shows the sample run
        run: node --import ./scripts/register-ts.mjs scripts/pages-smoke.mjs "$PAGE_URL" "$SAMPLE_RUN_KEY"
