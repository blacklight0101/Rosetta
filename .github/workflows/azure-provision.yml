# Azure provisioning (RF-1304, RF-1306, RNF-003, RNF-016, ADR-024, DEC-140, DEC-171, P1-184): creates,
# idempotently, the hosted deployment of ADR-024 in the existing resource group rg-rosetta (Spain
# Central): a Log Analytics workspace, the Container Apps environment, a storage account with an
# Azure Files share mounted at /data, the PostgreSQL 17 Flexible Server with its database, roles and
# a CanNotDelete lock, the migrate Container Apps job and the Container App. Running it again
# converges the same resources and keeps the database passwords the app already holds; the input
# rotate-passwords makes new ones (a short outage, runbook section Database roles). The input
# db-server points it at a server restored from a backup (runbook section Restore).
#
# It runs only by hand (Actions, Azure provision, Run workflow, branch main) and creates billed
# resources: the owner starts it (docs/runbooks/deploy.md, section Provisioning). It logs in with
# OIDC (azure/login, a federated credential for environment production); no Azure secret is stored
# in GitHub. The production environment holds:
#   variables  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   secrets    ROSETTA_SECRET_KEY, ROSETTA_ADMIN_USER, ROSETTA_ADMIN_PASSWORD (required) and
#              ROSETTA_SECRET_KEY_PREVIOUS, OPENAI_API_KEY, ANTHROPIC_API_KEY, ROSETTA_GITHUB_TOKEN
# The database passwords are made in the job (openssl rand), masked, and stored only as Container
# Apps secrets; every app secret reaches the container as a secretref: variable. Secret values
# reach az only as @file arguments from a mode-700 folder, never on a command line. No value is
# written here or printed.
name: Azure provision

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to start with, sha-<short> from a Release run'
        required: true
        type: string
      rotate-passwords:
        description: 'Make new database passwords (the app cannot connect for about a minute)'
        required: false
        default: false
        type: boolean
      db-server:
        description: 'PostgreSQL server name, only to switch to a server restored from a backup'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A provisioning run is never cancelled half-way through creating a resource.
concurrency:
  group: azure-provision-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    name: provision (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    # Never at the same time as a deploy of release.yml.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZ_RG: rg-rosetta
      AZ_LOCATION: spaincentral
      AZ_LOGS: log-rosetta
      AZ_ENVIRONMENT: cae-rosetta
      AZ_SHARE: rosetta-data
      AZ_APP: ca-rosetta
      AZ_MIGRATE_JOB: caj-rosetta-migrate
      AZ_DB_NAME: rosetta
      AZ_DB_ADMIN: rosettaadmin
      AZ_DB_LOCK: rosetta-db-no-delete
      IMAGE: ghcr.io/blacklight0101/rosetta
      IMAGE_TAG: ${{ inputs.image-tag }}
      ROTATE_PASSWORDS: ${{ inputs.rotate-passwords }}
      DB_SERVER: ${{ inputs.db-server }}
    steps:
      - name: The provisioning settings are stored
        run: |
          tag_pattern='^sha-[0-9a-f]{7,40}$'
          if ! [[ $IMAGE_TAG =~ $tag_pattern ]]; then
            echo "::error::The image-tag input must be sha-<short>, the tag of a Release run."
            exit 1
          fi
          missing=''
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ROSETTA_SECRET_KEY ROSETTA_ADMIN_USER ROSETTA_ADMIN_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in the production environment:$missing (docs/runbooks/deploy.md)."
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ROSETTA_SECRET_KEY: ${{ secrets.ROSETTA_SECRET_KEY }}
          ROSETTA_ADMIN_USER: ${{ secrets.ROSETTA_ADMIN_USER }}
          ROSETTA_ADMIN_PASSWORD: ${{ secrets.ROSETTA_ADMIN_PASSWORD }}
      - name: Log in to Azure (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Storage account and server names are global; a suffix from the subscription keeps them
      # unique and the same on every run (db-server overrides the server after a restore).
      # Generated values live only in this folder (mode 700).
      - name: Work out the resource names
        run: |
          suffix="$(printf '%s/%s' "$AZURE_SUBSCRIPTION_ID" "$AZ_RG" | sha256sum | cut -c1-8)"
          server="${DB_SERVER:-psql-rosetta-$suffix}"
          server_pattern='^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
          if ! [[ $server =~ $server_pattern ]]; then
            echo "::error::The db-server input must be a PostgreSQL server name (lower case, digits, dashes)."
            exit 1
          fi
          {
            echo "AZ_STORAGE=strosetta$suffix"
            echo "AZ_DB_SERVER=$server"
            echo "SECRETS_DIR=$RUNNER_TEMP/rosetta-secrets"
          } >> "$GITHUB_ENV"
          (umask 077 && mkdir -p "$RUNNER_TEMP/rosetta-secrets")
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log Analytics workspace and Container Apps environment
        run: |
          az monitor log-analytics workspace create --resource-group "$AZ_RG" --workspace-name "$AZ_LOGS" \
            --location "$AZ_LOCATION" --retention-time 30 --output none
          if ! az containerapp env show --name "$AZ_ENVIRONMENT" --resource-group "$AZ_RG" --output none 2> /dev/null; then
            workspace_id="$(az monitor log-analytics workspace show --resource-group "$AZ_RG" --workspace-name "$AZ_LOGS" --query customerId --output tsv)"
            az monitor log-analytics workspace get-shared-keys --resource-group "$AZ_RG" --workspace-name "$AZ_LOGS" \
              --query primarySharedKey --output tsv | tr -d '\r\n' > "$SECRETS_DIR/logs-key"
            echo "::add-mask::$(< "$SECRETS_DIR/logs-key")"
            # Consumption only: no workload profiles, so no Dedicated plan (ADR-024 risks).
            az containerapp env create --name "$AZ_ENVIRONMENT" --resource-group "$AZ_RG" --location "$AZ_LOCATION" \
              --logs-workspace-id "$workspace_id" --logs-workspace-key "@$SECRETS_DIR/logs-key" \
              --enable-workload-profiles false --output none
          fi
      # ADR-024: a classic SMB share (Hot LRS); the mountOptions of the app's volume let the
      # non-root node user (uid 1000) write.
      - name: Storage account and the /data share
        run: |
          az storage account create --name "$AZ_STORAGE" --resource-group "$AZ_RG" --location "$AZ_LOCATION" \
            --sku Standard_LRS --kind StorageV2 --access-tier Hot --https-only true --min-tls-version TLS1_2 \
            --allow-blob-public-access false --output none
          if ! az storage share-rm show --storage-account "$AZ_STORAGE" --resource-group "$AZ_RG" --name "$AZ_SHARE" --output none 2> /dev/null; then
            az storage share-rm create --storage-account "$AZ_STORAGE" --resource-group "$AZ_RG" --name "$AZ_SHARE" \
              --quota 5 --access-tier Hot --output none
          fi
          az storage account keys list --account-name "$AZ_STORAGE" --resource-group "$AZ_RG" \
            --query '[0].value' --output tsv | tr -d '\r\n' > "$SECRETS_DIR/storage-key"
          echo "::add-mask::$(< "$SECRETS_DIR/storage-key")"
          az containerapp env storage set --name "$AZ_ENVIRONMENT" --resource-group "$AZ_RG" --storage-name "$AZ_SHARE" \
            --azure-file-account-name "$AZ_STORAGE" --azure-file-account-key "@$SECRETS_DIR/storage-key" \
            --azure-file-share-name "$AZ_SHARE" --access-mode ReadWrite --output none
      # PostgreSQL 17, Burstable B1MS, 32 GiB, TLS required, reachable only from Azure services,
      # backups kept 7 days (RF-1306). The administrator password is new on every run and is kept
      # nowhere: the owner resets it with az when needed (docs/runbooks/deploy.md, Backup).
      # Argument shapes of azure-cli 2.87 and later (the runner has 2.91): child resources take
      # --server-name for the server and --name for themselves; create takes no --database-name.
      - name: PostgreSQL Flexible Server and database
        run: |
          openssl rand -hex 24 | tr -dc 0-9a-f > "$SECRETS_DIR/db-admin-password"
          echo "::add-mask::$(< "$SECRETS_DIR/db-admin-password")"
          if az postgres flexible-server show --name "$AZ_DB_SERVER" --resource-group "$AZ_RG" --output none 2> /dev/null; then
            az postgres flexible-server update --name "$AZ_DB_SERVER" --resource-group "$AZ_RG" \
              --admin-password "@$SECRETS_DIR/db-admin-password" --output none
          else
            az postgres flexible-server create --name "$AZ_DB_SERVER" --resource-group "$AZ_RG" --location "$AZ_LOCATION" \
              --version 17 --tier Burstable --sku-name Standard_B1ms --storage-size 32 --storage-auto-grow Disabled \
              --backup-retention 7 --geo-redundant-backup Disabled --public-access None \
              --admin-user "$AZ_DB_ADMIN" --admin-password "@$SECRETS_DIR/db-admin-password" --yes --output none
          fi
          # azure-cli 2.91 creates the server with public access disabled for --public-access None,
          # and a firewall rule is refused on such a server; this also converges an existing one.
          az postgres flexible-server update --resource-group "$AZ_RG" --name "$AZ_DB_SERVER" \
            --public-access Enabled --output none
          az postgres flexible-server parameter set --resource-group "$AZ_RG" --server-name "$AZ_DB_SERVER" \
            --name require_secure_transport --value on --output none
          az postgres flexible-server firewall-rule create --resource-group "$AZ_RG" --server-name "$AZ_DB_SERVER" \
            --name AllowAllAzureServicesAndResourcesWithinAzureIps --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 \
            --output none
          if ! az postgres flexible-server db show --resource-group "$AZ_RG" --server-name "$AZ_DB_SERVER" --name "$AZ_DB_NAME" --output none 2> /dev/null; then
            az postgres flexible-server db create --resource-group "$AZ_RG" --server-name "$AZ_DB_SERVER" \
              --name "$AZ_DB_NAME" --output none
          fi
      # ADR-024: the backups are deleted with the server, so the server gets a CanNotDelete lock.
      # Creating a lock needs Owner or User Access Administrator; the deploy identity is Contributor,
      # so when it cannot, the job warns and names the owner's command (runbook, Provisioning).
      - name: CanNotDelete lock on the server
        run: |
          lock=(--name "$AZ_DB_LOCK" --resource-group "$AZ_RG" --resource "$AZ_DB_SERVER" --resource-type Microsoft.DBforPostgreSQL/flexibleServers)
          if az lock show "${lock[@]}" --output none 2> /dev/null; then
            echo "The CanNotDelete lock $AZ_DB_LOCK is in place."
          elif ! az lock create "${lock[@]}" --lock-type CanNotDelete --notes 'Backups are deleted with the server (ADR-024).' --output none; then
            echo "::warning::No CanNotDelete lock on $AZ_DB_SERVER: the owner runs az lock create (docs/runbooks/deploy.md, Provisioning)."
            echo "- Missing: CanNotDelete lock \`$AZ_DB_LOCK\` on \`$AZ_DB_SERVER\` (owner step)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # RNF-016: a rerun keeps the passwords the running app and the migrate job already hold (read
      # back from their Container Apps secrets), so the app keeps its connections. New passwords
      # only on the first provisioning (no app yet) or with rotate-passwords.
      - name: Database passwords
        run: |
          if [ "$ROTATE_PASSWORDS" = true ] || ! az containerapp show --name "$AZ_APP" --resource-group "$AZ_RG" --output none 2> /dev/null; then
            openssl rand -hex 24 | tr -dc 0-9a-f > "$SECRETS_DIR/app-db-password"
            openssl rand -hex 24 | tr -dc 0-9a-f > "$SECRETS_DIR/migrator-db-password"
            echo "New database passwords for rosetta_app and rosetta_migrator."
          else
            app_url="$(az containerapp secret show --name "$AZ_APP" --resource-group "$AZ_RG" --secret-name database-url --query value --output tsv)"
            echo "::add-mask::$app_url"
            migrator_url="$(az containerapp job secret show --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --secret-name database-migrator-url --query value --output tsv)"
            echo "::add-mask::$migrator_url"
            app_pw="${app_url#postgres://rosetta_app:}"
            migrator_pw="${migrator_url#postgres://rosetta_migrator:}"
            if [ "$app_pw" = "$app_url" ] || [ "$migrator_pw" = "$migrator_url" ]; then
              echo "::error::The stored database URLs are not in the expected form; run again with rotate-passwords."
              exit 1
            fi
            printf '%s' "${app_pw%%@*}" > "$SECRETS_DIR/app-db-password"
            printf '%s' "${migrator_pw%%@*}" > "$SECRETS_DIR/migrator-db-password"
            echo "Kept the database passwords of the running app."
          fi
          echo "::add-mask::$(< "$SECRETS_DIR/app-db-password")"
          echo "::add-mask::$(< "$SECRETS_DIR/migrator-db-password")"
      # data-model.md section 6, the statements of db/init/roles.sh made idempotent. The runner
      # reaches the server through the Azure services rule; psql reads the passwords from the
      # environment (\getenv), so none is an argument.
      - name: Database roles
        run: |
          PGPASSWORD="$(< "$SECRETS_DIR/db-admin-password")" \
          ROSETTA_APP_DB_PASSWORD="$(< "$SECRETS_DIR/app-db-password")" \
          ROSETTA_MIGRATOR_DB_PASSWORD="$(< "$SECRETS_DIR/migrator-db-password")" \
            psql --no-psqlrc -v ON_ERROR_STOP=1 \
              "host=$AZ_DB_SERVER.postgres.database.azure.com port=5432 dbname=$AZ_DB_NAME user=$AZ_DB_ADMIN sslmode=require" <<'SQL'
          \getenv app_password ROSETTA_APP_DB_PASSWORD
          \getenv migrator_password ROSETTA_MIGRATOR_DB_PASSWORD
          SELECT 'CREATE ROLE rosetta_migrator' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'rosetta_migrator')\gexec
          SELECT 'CREATE ROLE rosetta_app' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'rosetta_app')\gexec
          ALTER ROLE rosetta_migrator LOGIN PASSWORD :'migrator_password';
          ALTER ROLE rosetta_app LOGIN PASSWORD :'app_password';
          GRANT rosetta_migrator TO CURRENT_USER;
          ALTER DATABASE rosetta OWNER TO rosetta_migrator;
          SET ROLE rosetta_migrator;
          GRANT USAGE ON SCHEMA public TO rosetta_app;
          RESET ROLE;
          SQL
      # DEC-140: the one-off migrate step of the image, with DATABASE_MIGRATOR_URL as its only
      # secret; the app starts only after it succeeded (RF-1302).
      - name: Migrate job, run it and wait for success
        run: |
          migrator_url="postgres://rosetta_migrator:$(< "$SECRETS_DIR/migrator-db-password")@$AZ_DB_SERVER.postgres.database.azure.com:5432/$AZ_DB_NAME?sslmode=require"
          echo "::add-mask::$migrator_url"
          printf 'database-migrator-url=%s' "$migrator_url" > "$SECRETS_DIR/migrator-secret"
          if az containerapp job show --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --output none 2> /dev/null; then
            az containerapp job secret set --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" \
              --secrets "@$SECRETS_DIR/migrator-secret" --output none
            az containerapp job update --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --image "$IMAGE:$IMAGE_TAG" --output none
          else
            az containerapp job create --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --environment "$AZ_ENVIRONMENT" \
              --trigger-type Manual --replica-timeout 900 --replica-retry-limit 0 --replica-completion-count 1 --parallelism 1 \
              --image "$IMAGE:$IMAGE_TAG" --cpu 0.5 --memory 1Gi --command node --args dist/presentation/migrate.js \
              --secrets "@$SECRETS_DIR/migrator-secret" \
              --env-vars DATABASE_MIGRATOR_URL=secretref:database-migrator-url ROSETTA_LOG_LEVEL=info --output none
          fi
          execution="$(az containerapp job start --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --query name --output tsv)"
          for _ in $(seq 1 90); do
            status="$(az containerapp job execution show --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --job-execution-name "$execution" --query properties.status --output tsv)"
            case "$status" in
              Succeeded) echo "Migrate execution $execution: Succeeded."; exit 0 ;;
              Running | Processing | '') sleep 10 ;;
              *) echo "::error::Migrate execution $execution ended $status; the app is not changed."; exit 1 ;;
            esac
          done
          echo "::error::Migrate execution $execution did not finish in 15 minutes; the app is not changed."
          exit 1
      # ADR-024: 0.5 vCPU, 1 GiB, one replica, external ingress on 8080 (HTTP redirected to HTTPS),
      # startup, liveness and readiness probes on /healthz, the share at /data. The definition is
      # built with jq from the environment (no value on a command line) into the secrets folder.
      # A new revision suffix per run makes the app read any changed secret, such as a rotated password.
      - name: Create or update the Container App
        run: |
          fqdn="$AZ_APP.$(az containerapp env show --name "$AZ_ENVIRONMENT" --resource-group "$AZ_RG" --query properties.defaultDomain --output tsv)"
          environment_id="$(az containerapp env show --name "$AZ_ENVIRONMENT" --resource-group "$AZ_RG" --query id --output tsv)"
          DATABASE_URL="postgres://rosetta_app:$(< "$SECRETS_DIR/app-db-password")@$AZ_DB_SERVER.postgres.database.azure.com:5432/$AZ_DB_NAME?sslmode=require"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          # Container Apps secret = the variable holding its value; an optional one left empty is
          # skipped together with the variable that refers to it.
          app_secrets='database-url=DATABASE_URL
          rosetta-secret-key=ROSETTA_SECRET_KEY
          rosetta-secret-key-previous=ROSETTA_SECRET_KEY_PREVIOUS
          rosetta-admin-user=ROSETTA_ADMIN_USER
          rosetta-admin-password=ROSETTA_ADMIN_PASSWORD
          openai-api-key=OPENAI_API_KEY
          anthropic-api-key=ANTHROPIC_API_KEY
          github-token=ROSETTA_GITHUB_TOKEN'
          app_env="DATABASE_URL=secretref:database-url
          ROSETTA_SECRET_KEY=secretref:rosetta-secret-key
          ROSETTA_SECRET_KEY_PREVIOUS=secretref:rosetta-secret-key-previous
          ROSETTA_ADMIN_USER=secretref:rosetta-admin-user
          ROSETTA_ADMIN_PASSWORD=secretref:rosetta-admin-password
          OPENAI_API_KEY=secretref:openai-api-key
          ANTHROPIC_API_KEY=secretref:anthropic-api-key
          GITHUB_TOKEN=secretref:github-token
          ROSETTA_TRUST_PROXY=1
          ROSETTA_DATA_DIR=/data
          ROSETTA_PUBLIC_URL=https://$fqdn
          ROSETTA_UPLOAD_MAX_MB=100
          ROSETTA_LOG_LEVEL=info"
          probe='{"httpGet": {"path": "/healthz", "port": 8080}, "timeoutSeconds": 5}'
          umask 077
          jq -n \
            --arg location "$AZ_LOCATION" --arg environment "$environment_id" --arg image "$IMAGE:$IMAGE_TAG" \
            --arg share "$AZ_SHARE" --arg suffix "p$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg secrets "$app_secrets" --arg variables "$app_env" --argjson probe "$probe" '
            def lines: split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""));
            ($secrets | lines | map(split("=") | {name: .[0], value: ($ENV[.[1]] // "")}) | map(select(.value != ""))) as $stored
            | ($stored | map(.name)) as $names
            | ($variables | lines | map(capture("^(?<name>[A-Z0-9_]+)=(?<value>.*)$"))
                | map(if (.value | startswith("secretref:")) then {name, secretRef: (.value | ltrimstr("secretref:"))} else . end)
                | map(select((has("secretRef") | not) or (.secretRef as $ref | $names | index($ref)))))
              as $env
            | {
                location: $location,
                properties: {
                  managedEnvironmentId: $environment,
                  configuration: {
                    activeRevisionsMode: "Single",
                    ingress: {external: true, targetPort: 8080, transport: "auto", allowInsecure: false},
                    secrets: $stored
                  },
                  template: {
                    revisionSuffix: $suffix,
                    containers: [{
                      name: "app",
                      image: $image,
                      resources: {cpu: 0.5, memory: "1Gi"},
                      env: $env,
                      probes: [
                        ($probe + {type: "Startup", initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 10}),
                        ($probe + {type: "Liveness", periodSeconds: 30, failureThreshold: 3}),
                        ($probe + {type: "Readiness", periodSeconds: 10, failureThreshold: 3})
                      ],
                      volumeMounts: [{volumeName: "data", mountPath: "/data"}]
                    }],
                    scale: {minReplicas: 1, maxReplicas: 1},
                    volumes: [{
                      name: "data",
                      storageType: "AzureFile",
                      storageName: $share,
                      mountOptions: "uid=1000,gid=1000,dir_mode=0755,file_mode=0755"
                    }]
                  }
                }
              }' > "$SECRETS_DIR/app.json"
          if az containerapp show --name "$AZ_APP" --resource-group "$AZ_RG" --output none 2> /dev/null; then
            az containerapp update --name "$AZ_APP" --resource-group "$AZ_RG" --yaml "$SECRETS_DIR/app.json" --output none
          else
            az containerapp create --name "$AZ_APP" --resource-group "$AZ_RG" --yaml "$SECRETS_DIR/app.json" --output none
          fi
          echo "PUBLIC_URL=https://$fqdn" >> "$GITHUB_ENV"
        env:
          ROSETTA_SECRET_KEY: ${{ secrets.ROSETTA_SECRET_KEY }}
          ROSETTA_SECRET_KEY_PREVIOUS: ${{ secrets.ROSETTA_SECRET_KEY_PREVIOUS }}
          ROSETTA_ADMIN_USER: ${{ secrets.ROSETTA_ADMIN_USER }}
          ROSETTA_ADMIN_PASSWORD: ${{ secrets.ROSETTA_ADMIN_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROSETTA_GITHUB_TOKEN: ${{ secrets.ROSETTA_GITHUB_TOKEN }}
      - name: Wait for the new revision and /healthz over HTTPS
        run: |
          for _ in $(seq 1 60); do
            revisions="$(az containerapp show --name "$AZ_APP" --resource-group "$AZ_RG" --query '[properties.latestRevisionName, properties.latestReadyRevisionName]' --output tsv | tr '\n' ' ')"
            read -r latest ready <<< "$revisions"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ] && curl -fsS --max-time 10 "$PUBLIC_URL/healthz" > /dev/null; then
              echo "Revision $latest is ready and $PUBLIC_URL/healthz answers."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PUBLIC_URL/healthz did not answer from the new revision in 10 minutes."
          exit 1
      - name: Summary
        run: |
          {
            echo "### Azure provision"
            echo "- Public URL: $PUBLIC_URL (set it as the production variable ROSETTA_PUBLIC_URL)"
            echo "- Image: $IMAGE:$IMAGE_TAG"
            echo "- Resource group: $AZ_RG; environment $AZ_ENVIRONMENT; app $AZ_APP; migrate job $AZ_MIGRATE_JOB"
            echo "- PostgreSQL server: $AZ_DB_SERVER; storage account: $AZ_STORAGE, share $AZ_SHARE at /data"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the generated values
        if: always()
        run: rm -rf "$RUNNER_TEMP/rosetta-secrets"
      - name: Log out of Azure
        if: always()
        run: az logout || true
