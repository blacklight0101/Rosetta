# Scheduled release (DEC-175, ADR-025): production deploys at 06:07 Madrid, with backup runs until 07:59,
# the morning after main changed, never on merge. The four daily schedules are in UTC: 04:07 and
# 05:07 are the first slot (06:07 Madrid in summer and winter time respectively), and 05:37 and 06:07
# are backups (GitHub may delay or drop a schedule, and it was dropped on 2026-10-28). Minutes 7 and
# 37 keep off the busy full hour, when GitHub delays schedules most. The job goes on only when it is
# the 06 or 07 hour in Madrid, or at any hour when started by hand. A slot that GitHub starts late,
# after 07:59 Madrid, goes on only when the head commit of main was merged before 06:00 Madrid that
# day (P7-28), so a delayed schedule deploys late rather than not at all. It starts Release
# (release.yml) on main by workflow_dispatch, once per head commit of main: it does nothing when a
# Release run of that commit is queued, running or succeeded, or while the repository variable
# ROSETTA_DEPLOY_ENABLED is not 'true'. The step summary names the slot that started it and its delay.
# Release itself refuses a main whose tree did not pass staging.
#
# Scheduled workflows run from the default branch (develop), so this file exists on develop and on
# main. It only dispatches: it reads no secret and uses no environment; the production environment
# stays restricted to main. Hardening as in ci.yml: read-only default token, actions: write only to
# start the run, values reach the shell step through env:.
name: Scheduled release

on:
  schedule:
    - cron: '7 4 * * *'
    - cron: '7 5 * * *'
    - cron: '37 5 * * *'
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One group for every slot: the slots run one at a time and a running slot is never cancelled, so a
# slot cannot dispatch while another one is still checking (P7-28).
concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch (Release of main at 06:07 Madrid, backups until 07:59)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start Release on main once per head commit
        run: |
          note() {
            echo "$1"
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
          }
          hour="$(TZ=Europe/Madrid date +%H)"
          late=false
          if [ "$EVENT" != workflow_dispatch ]; then
            case "$hour" in
              06 | 07) ;;
              *)
                if [ "$((10#$hour))" -lt 8 ]; then
                  note "Slot $SLOT: it is the $hour hour in Madrid, before the 06:07 window; nothing to do."
                  exit 0
                fi
                late=true
                ;;
            esac
          fi
          if [ "$DEPLOY_ENABLED" != true ]; then
            note "The repository variable ROSETTA_DEPLOY_ENABLED is not true; no Release is started."
            exit 0
          fi
          sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          sha_pattern='^[0-9a-f]{40}$'
          if ! [[ $sha =~ $sha_pattern ]]; then
            echo "::error::The head of main could not be read."
            exit 1
          fi
          # A Release dispatched seconds earlier may not be listed as queued yet, so one created in the
          # last ten minutes on this commit counts as well (P7-28).
          cutoff="$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          filter="[.[] | select(.headSha == \"$sha\" and (.status != \"completed\" or .conclusion == \"success\" or .createdAt >= \"$cutoff\"))] | length"
          active="$(gh run list --workflow release.yml --branch main --limit 100 --json headSha,status,conclusion,createdAt --jq "$filter")"
          if [ "$active" != 0 ]; then
            note "Slot $SLOT, Madrid hour $hour: main is at $sha and a Release run of it is queued, running or succeeded; no Release is started."
            exit 0
          fi
          if [ "$late" = true ]; then
            committed="$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date)"
            today="$(TZ=Europe/Madrid date +%F)"
            cutoff="$(TZ=Europe/Madrid date -d "$today 06:00" +%s)"
            if [ "$(date -d "$committed" +%s)" -ge "$cutoff" ]; then
              note "Slot $SLOT, Madrid hour $hour: main is at $sha, merged $committed (UTC), after 06:00 Madrid today; no Release is started (the 06:07 slot of tomorrow takes it)."
              exit 0
            fi
          fi
          delay=''
          if [ "$EVENT" = schedule ]; then
            read -r minute utc_hour _ <<< "$SLOT"
            slot_at="$(date -u -d "$(date -u +%F) $(printf '%02d:%02d' "$((10#$utc_hour))" "$((10#$minute))"):00" +%s)"
            delay=", $(( ($(date -u +%s) - slot_at) / 60 )) minutes after its slot"
          fi
          gh workflow run release.yml --ref main
          note "Slot $SLOT, Madrid hour $hour$delay: started Release on main at $sha (it deploys to production once its checks pass)."
        env:
          EVENT: ${{ github.event_name }}
          SLOT: ${{ github.event.schedule || 'by hand' }}
          DEPLOY_ENABLED: ${{ vars.ROSETTA_DEPLOY_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
