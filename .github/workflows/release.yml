# Release (RF-1300, RF-1304, DEC-29, DEC-57, DEC-104, ADR-014, ADR-024, P1-55, P1-184): builds the
# runtime image once, scans it, and pushes it to GHCR as `sha-<short>` (and `X.Y.Z` for a `vX.Y.Z`
# tag); for a tag it also attaches a CycloneDX SBOM to the GitHub release. It runs only on a pushed
# v* tag or by hand (workflow_dispatch on main, the way the sha-<short> image of main is published
# before v0.1.0, DEC-104); never on a pull request or a push to main.
#
# The deploy job updates the Azure Container App that azure-provision.yml created (ADR-024). It runs
# only when the repository variable ROSETTA_DEPLOY_ENABLED is 'true', in the GitHub environment
# `production`, which holds:
#   secrets    ROSETTA_SMOKE_PASSWORD (teacher password)
#   variables  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC login, no Azure secret),
#              ROSETTA_PUBLIC_URL (the https URL), ROSETTA_SMOKE_USER (teacher)
# No value is written here. Hardening as in ci.yml: read-only default token, write scopes only in
# the job that needs them, actions pinned to a commit SHA, values reach shell steps through env:.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A release is never cancelled half-way through a push or a deploy.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image (build, scan, push to GHCR)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.tags.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # sha-<short> always; X.Y.Z only for a tag that is v<package.json version> on main (DEC-29).
      - name: Work out the image tags
        id: tags
        run: bash scripts/release-tags.sh
        env:
          IMAGE: ghcr.io/blacklight0101/rosetta
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
      - name: Build the runtime image
        run: docker build --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" --tag rosetta:release .
        env:
          REPOSITORY: ${{ github.repository }}
      # The same gate as the image job of ci.yml: a fixable High or Critical finding stops the release.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rosetta:release
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
      - name: Log in to GHCR
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - name: Push the tags
        run: |
          for tag in $TAGS; do
            docker tag rosetta:release "$tag"
            docker push "$tag"
          done
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  sbom:
    name: sbom (CycloneDX on the GitHub release)
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The runtime dependencies from the lock file, the ones the image ships (DEC-57).
      - name: Write the CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "rosetta-${REF_NAME#v}.cdx.json"
        env:
          REF_NAME: ${{ github.ref_name }}
      # The owner normally creates the release with its notes; if it does not exist yet, a release
      # pointing at docs/releases.md is created so the SBOM has a place to go.
      - name: Attach the SBOM to the GitHub release
        run: |
          if ! gh release view "$REF_NAME" > /dev/null 2>&1; then
            gh release create "$REF_NAME" --verify-tag --title "$REF_NAME" --notes "Release notes: docs/releases.md"
          fi
          gh release upload "$REF_NAME" "rosetta-${REF_NAME#v}.cdx.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}

  # ADR-024: OIDC login, the migrate job with the new image (it must succeed), then the new image on
  # the Container App, /healthz over HTTPS and the smoke test. Off until the owner sets
  # ROSETTA_DEPLOY_ENABLED (docs/runbooks/deploy.md).
  deploy:
    name: deploy (production)
    needs: [image]
    if: vars.ROSETTA_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.ROSETTA_PUBLIC_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      id-token: write
    env:
      AZ_RG: rg-rosetta
      AZ_APP: ca-rosetta
      AZ_MIGRATE_JOB: caj-rosetta-migrate
      IMAGE: ghcr.io/blacklight0101/rosetta
      SHA_TAG: ${{ needs.image.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Threat model section 5: the zap-baseline check of ci.yml passed on this commit.
      - name: The ZAP baseline passed on this commit
        run: |
          conclusion="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?check_name=zap-baseline" --jq '.check_runs[0].conclusion // "missing"')"
          echo "zap-baseline on $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != success ]; then
            echo "::error::The ZAP baseline did not pass on this commit; nothing is deployed."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: The deploy settings are stored
        run: |
          missing=''
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ROSETTA_SMOKE_PASSWORD ROSETTA_SMOKE_USER ROSETTA_PUBLIC_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in the production environment:$missing (docs/runbooks/deploy.md)."
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ROSETTA_SMOKE_PASSWORD: ${{ secrets.ROSETTA_SMOKE_PASSWORD }}
          ROSETTA_SMOKE_USER: ${{ vars.ROSETTA_SMOKE_USER }}
          ROSETTA_PUBLIC_URL: ${{ vars.ROSETTA_PUBLIC_URL }}
      - name: Log in to Azure (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # RF-1306: Burstable servers have no on-demand backup; the point-in-time restore of the
      # Flexible Server (kept 7 days) is the backup before the deploy, so its time is recorded.
      - name: Record the restore point
        run: |
          restore_point="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Restore point before deploying $IMAGE:$SHA_TAG is $restore_point (UTC)." >> "$GITHUB_STEP_SUMMARY"
      # DEC-140, RF-1302: the migrate job runs the new image with DATABASE_MIGRATOR_URL as its only
      # secret; any end state but Succeeded stops the deploy and the previous image keeps running.
      - name: Migrate with the new image and wait for success
        run: |
          az containerapp job update --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --image "$IMAGE:$SHA_TAG" --output none
          execution="$(az containerapp job start --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --query name --output tsv)"
          for _ in $(seq 1 90); do
            status="$(az containerapp job execution show --name "$AZ_MIGRATE_JOB" --resource-group "$AZ_RG" --job-execution-name "$execution" --query properties.status --output tsv)"
            case "$status" in
              Succeeded) echo "Migrate execution $execution: Succeeded."; exit 0 ;;
              Running | Processing | '') sleep 10 ;;
              *) echo "::error::Migrate execution $execution ended $status; the app is not changed."; exit 1 ;;
            esac
          done
          echo "::error::Migrate execution $execution did not finish in 15 minutes; the app is not changed."
          exit 1
      - name: Set the new image on the Container App
        run: az containerapp update --name "$AZ_APP" --resource-group "$AZ_RG" --image "$IMAGE:$SHA_TAG" --output none
      - name: Wait for the new revision and /healthz over HTTPS
        run: |
          for _ in $(seq 1 60); do
            revisions="$(az containerapp show --name "$AZ_APP" --resource-group "$AZ_RG" --query '[properties.latestRevisionName, properties.latestReadyRevisionName]' --output tsv | tr '\n' ' ')"
            read -r latest ready <<< "$revisions"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ] && curl -fsS --max-time 10 "$ROSETTA_PUBLIC_URL/healthz" > /dev/null; then
              echo "Revision $latest is ready and $ROSETTA_PUBLIC_URL/healthz answers."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$ROSETTA_PUBLIC_URL/healthz did not answer from the new revision in 10 minutes."
          exit 1
        env:
          ROSETTA_PUBLIC_URL: ${{ vars.ROSETTA_PUBLIC_URL }}
      - name: Smoke test on the public URL
        run: node scripts/smoke.mjs "$ROSETTA_PUBLIC_URL"
        env:
          ROSETTA_PUBLIC_URL: ${{ vars.ROSETTA_PUBLIC_URL }}
          ROSETTA_SMOKE_USER: ${{ vars.ROSETTA_SMOKE_USER }}
          ROSETTA_SMOKE_PASSWORD: ${{ secrets.ROSETTA_SMOKE_PASSWORD }}
      - name: Log out of Azure
        if: always()
        run: az logout || true
