# CI gates (environments-and-delivery.md section 6, ADR-011). Hardening: top-level read-only token,
# a timeout on every job, one run per branch, third-party actions pinned to a commit SHA, no secrets,
# values reach shell steps through env: and never as an expression inside run:.
# A pull request that changes only documentation skips the heavy steps (not the jobs, so every
# required check still reports under its own name); see environments-and-delivery.md section 6.
name: CI

# An edit of a pull request (its title or body) does not run this workflow: a job skipped for that
# event would report "skipped", which a required check counts as passed, so it would hide a failed run
# of the same commit, and the edit would cancel a running one. The title check has its own workflow,
# pr-title.yml, which does run on edited.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # code=true unless every file the pull request changes is documentation: anything under docs/ or
  # a *.md file at the repository root. Markdown anywhere else (src/, tests/, prompts/, templates/...)
  # is code. --no-renames lists both paths of a move. A push to main always counts as code. Plain
  # git, no third-party action. The other jobs fail closed: their heavy steps run unless code is
  # exactly 'false'.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
            printf 'Changed files:\n%s\n' "$files"
            code=false
            [ -n "$files" ] || code=true
            while IFS= read -r file; do
              case "$file" in
                '') ;;
                src/* | tests/* | prompts/*) code=true ;;
                docs/*) ;;
                */*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # The static gates (P1-177): typecheck, lint, format, architecture and dead code, in parallel with
  # the tests. They give the same answer on every operating system, so they run once, on Linux.
  # One step per gate, so a failure names its gate; a failed step does not hide the later ones.
  gates:
    name: gates
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::The gates are skipped; the tests job checks the format."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # CI=true on the runner keeps lefthook from writing git hooks.
      - if: needs.changes.outputs.code != 'false'
        run: npm ci
      - name: Type check
        if: needs.changes.outputs.code != 'false'
        run: npm run typecheck
      - name: Lint (zero warnings)
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run lint
      - name: Format check
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run format:check
      - name: Architecture rule
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run arch
      - name: Dead code and dependencies
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run deadcode

  # The unit, web and integration tests on both operating systems, in three shards per operating system
  # (P1-178). Each shard runs a third of the test files with coverage on and writes a blob report; the
  # `tests` job below merges the three blobs of an operating system and enforces the coverage thresholds.
  # Not a required check by itself. To change the shard count, change the matrix list and the `/3` of the
  # test step together (environments-and-delivery.md section 6; workflow-jobs.test.ts keeps them equal).
  tests-shard:
    name: tests (${{ matrix.os }}, shard ${{ matrix.shard }}/3)
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3]
        include:
          - os: ubuntu-latest
            # Disposable database for the integration tests (P1-06); the credentials are throwaway.
            # Every Linux shard has its own service container.
            database-url: postgres://postgres:postgres@127.0.0.1:5432/rosetta_test
            services:
              postgres:
                image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: rosetta_test
                ports:
                  - 5432:5432
                options: >-
                  --health-cmd "pg_isready -U postgres"
                  --health-interval 5s
                  --health-timeout 5s
                  --health-retries 10
          - os: windows-latest
            database-url: ''
            services: {}
    services: ${{ matrix.services }}
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::The steps of this job are skipped."
        shell: bash
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # CI=true on the runner keeps lefthook from writing git hooks.
      - if: needs.changes.outputs.code != 'false'
        run: npm ci
      - name: Database tests are skipped on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.code != 'false'
        run: echo "::notice title=Database tests skipped::No PostgreSQL service container on Windows runners; the Linux job runs them."
        shell: bash
      # The Playwright project runs in the sharded e2e jobs, in parallel with this one; the static gates
      # run in the `gates` job. The shard does not check the coverage thresholds (it sees a third of the
      # code): ROSETTA_COVERAGE_SHARD=1 turns them off here, and the `tests` job enforces them on the merge.
      - name: Tests with coverage (shard)
        if: needs.changes.outputs.code != 'false'
        run: npm run test:shard -- "--shard=$SHARD/3" "--outputFile.blob=test-results/blob/blob-$SHARD.json"
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          ROSETTA_TEST_DATABASE_URL: ${{ matrix.database-url }}
          ROSETTA_E2E_OWN_JOB: '1'
          ROSETTA_COVERAGE_SHARD: '1'
      - name: Upload the blob report
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/blob/blob-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # The merge of the shards of one operating system (P1-178): downloads the blob reports, merges the test
  # results and the coverage, enforces the coverage thresholds and prints the test pyramid. Not a required
  # check by itself: the required `verify (<os>)` checks below aggregate it with the shards and the gates.
  # For a documentation-only change the Linux leg checks the format and the tests that read the documents.
  tests:
    name: tests (${{ matrix.os }})
    needs: [changes, tests-shard]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            database-url: postgres://postgres:postgres@127.0.0.1:5432/rosetta_test
            services:
              postgres:
                image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: rosetta_test
                ports:
                  - 5432:5432
                options: >-
                  --health-cmd "pg_isready -U postgres"
                  --health-interval 5s
                  --health-timeout 5s
                  --health-retries 10
          - os: windows-latest
            database-url: ''
            services: {}
    services: ${{ matrix.services }}
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::Heavy steps skipped; Linux checks the format and runs the tests that read the documents."
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os == 'Linux' || needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux' || needs.changes.outputs.code != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      # CI=true on the runner keeps lefthook from writing git hooks.
      - if: runner.os == 'Linux' || needs.changes.outputs.code != 'false'
        run: npm ci
      - name: Download the blob reports of the shards
        if: needs.changes.outputs.code != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-${{ matrix.os }}-*
          path: test-results/blob
          merge-multiple: true
      # A missing blob would silently drop a third of the tests, so the count is checked before the merge.
      - name: Check that every shard reported
        if: needs.changes.outputs.code != 'false'
        run: test "$(find test-results/blob -name 'blob-*.json' | wc -l)" -eq 3
        shell: bash
      # The thresholds (vitest.config.ts) apply here, to the coverage of the whole run; the shard switch
      # is not set. The pyramid is printed from the merged JSON report, as before.
      - name: Merge the reports, check the coverage thresholds
        if: needs.changes.outputs.code != 'false'
        run: npm run test:merge
      # Documentation only: the format check and every test that reads the documents
      # (environments-and-delivery.md section 6 lists them; workflow-docs-only.test.ts keeps the list whole).
      - name: Format check (documentation only)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'false'
        run: npm run format:check
      - name: Tests that read the documents (documentation only)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'false'
        run: >-
          npx vitest run
          tests/integration/docs
          tests/integration/tooling/workflows.test.ts
          tests/integration/tooling/azure-provision-workflow.test.ts
          tests/integration/tooling/workflow-docs-only.test.ts
          tests/integration/infrastructure/db/release-schema.test.ts
          tests/unit/web/status-badge.test.tsx
          tests/unit/domain/cards/card-vocabulary.test.ts
          tests/unit/web/tokens.test.ts
        env:
          ROSETTA_TEST_DATABASE_URL: ${{ matrix.database-url }}

  # The required checks `verify (ubuntu-latest)` and `verify (windows-latest)`: green only when the test
  # shards, the merge of the tests and the gates passed. Runs for every change (no condition but always()),
  # so a skipped or cancelled job counts as a failure here and cannot be mistaken for a pass.
  verify:
    name: verify (${{ matrix.os }})
    if: always()
    needs: [gates, tests-shard, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: |
          test "$SHARDS" = success
          test "$TESTS" = success
          test "$GATES" = success
        env:
          SHARDS: ${{ needs.tests-shard.result }}
          TESTS: ${{ needs.tests.result }}
          GATES: ${{ needs.gates.result }}

  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/3)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      # Disposable database for the end-to-end tests; the credentials are throwaway.
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosetta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::The steps of this job are skipped."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.code != 'false'
        run: npm ci
      # Chromium is cached per Playwright version and installed without apt: the apt mirror stalled
      # for 10 minutes on PR #800 (P1-183). System packages are installed only if Chromium cannot start.
      - name: Playwright version
        id: playwright-version
        if: needs.changes.outputs.code != 'false'
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: needs.changes.outputs.code != 'false'
        timeout-minutes: 3
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then((browser) => browser.close())" || npx playwright install-deps chromium
      # One third of the Playwright project (RNF-005); the three shards together run every spec.
      - if: needs.changes.outputs.code != 'false'
        run: node scripts/run-e2e.mjs "--shard=$SHARD/3"
        env:
          SHARD: ${{ matrix.shard }}
          ROSETTA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rosetta_test

  # One stable check name for the ruleset: green only when every shard passed.
  e2e:
    name: e2e
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-shard.result }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npm audit exits non-zero on findings; audit-check.mjs decides, honouring audit-exceptions.json.
      - run: |
          npm audit --audit-level=high --omit=dev --json > "$RUNNER_TEMP/audit-report.json" || true
          node scripts/audit-check.mjs --report "$RUNNER_TEMP/audit-report.json" --today "$(date -u +%F)"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Personal account: no licence key needed. github.token is the run's automatic token.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: never

  image:
    name: image (build, container test, trivy)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROSETTA_IMAGE: rosetta:ci
    services:
      # Disposable database for the container test; the credentials are throwaway (P1-44).
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosetta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::The steps of this job are skipped."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.code != 'false'
        run: npm ci
      # The runtime image is the default target; the test image must build too (compose.ci.yaml, P1-45).
      - if: needs.changes.outputs.code != 'false'
        run: docker build --tag "$ROSETTA_IMAGE" .
      - if: needs.changes.outputs.code != 'false'
        run: docker build --target test --tag rosetta:ci-test .
      # Starts the image against the service database and calls /healthz (RF-1300, Linux only).
      - if: needs.changes.outputs.code != 'false'
        run: npx vitest run --project integration tests/integration/image
        env:
          ROSETTA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rosetta_test
      # High and critical findings that have a fix fail the job (RF-1300, environments-and-delivery.md section 6).
      - if: needs.changes.outputs.code != 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rosetta:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  compose-smoke:
    name: compose smoke (up, scan, restart, down)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::The steps of this job are skipped."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.code != 'false'
        run: npm ci
      # Chromium is cached per Playwright version and installed without apt: the apt mirror stalled
      # for 10 minutes on PR #800 (P1-183). System packages are installed only if Chromium cannot start.
      - name: Playwright version
        id: playwright-version
        if: needs.changes.outputs.code != 'false'
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: needs.changes.outputs.code != 'false'
        timeout-minutes: 3
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then((browser) => browser.close())" || npx playwright install-deps chromium
      # A throwaway .env for this run: fresh random values, masked in the log, never committed
      # (RNF-003). The URL-safe hex keeps the passwords valid inside the database URLs.
      - name: Write a throwaway .env
        if: needs.changes.outputs.code != 'false'
        run: |
          : > .env
          add() { value="$(openssl rand "$2" "$3")"; echo "::add-mask::$value"; echo "$1=$value" >> .env; }
          add ROSETTA_DB_ADMIN_PASSWORD -hex 16
          add ROSETTA_APP_DB_PASSWORD -hex 16
          add ROSETTA_MIGRATOR_DB_PASSWORD -hex 16
          add ROSETTA_SECRET_KEY -base64 32
          add ROSETTA_ADMIN_PASSWORD -hex 16
          add ROSETTA_SMOKE_NEW_PASSWORD -hex 16
          echo "ROSETTA_ADMIN_USER=smoke-admin" >> .env
      # The CI overlay swaps the app for the image's test stage with the fake provider and fake GitHub.
      - name: Start the stack
        if: needs.changes.outputs.code != 'false'
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait
      - name: Wait for /healthz
        if: needs.changes.outputs.code != 'false'
        run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/healthz
      - name: Smoke test (landing, sign-in, scan)
        if: needs.changes.outputs.code != 'false'
        run: |
          set -a; . ./.env; set +a
          npx playwright test --config=playwright.compose.config.ts smoke
      - name: Restart the stack, keeping its volumes
        if: needs.changes.outputs.code != 'false'
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml down
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait
      - name: Data survives the restart
        if: needs.changes.outputs.code != 'false'
        run: |
          set -a; . ./.env; set +a
          npx playwright test --config=playwright.compose.config.ts persistence
      # The smoke script of a deployment (scripts/smoke.mjs, P1-55) on the same stack: health,
      # landing, sign-in of the administrator with the password the smoke spec chose, a scan.
      - name: Smoke script (health, landing, sign-in, scan)
        if: needs.changes.outputs.code != 'false'
        run: |
          set -a; . ./.env; set +a
          export ROSETTA_SMOKE_USER="$ROSETTA_ADMIN_USER" ROSETTA_SMOKE_PASSWORD="$ROSETTA_SMOKE_NEW_PASSWORD"
          export ROSETTA_SMOKE_REPO=https://github.com/octo/demo
          node scripts/smoke.mjs http://127.0.0.1:8080
      - name: Stack logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail 200
      # Always remove the stack and its volumes, whatever failed.
      - name: Remove the stack and its volumes
        if: always() && needs.changes.outputs.code != 'false'
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v --rmi local

  # OWASP ZAP baseline (threat model section 5, environments-and-delivery.md section 10, P1-55): a
  # passive scan of the Compose stack of the runtime image, the image that is deployed (no CI
  # overlay). The deploy job of release.yml refuses a commit on which this check did not pass.
  # The ZAP image is pinned by digest (2.17.0); scripts/zap-summary.mjs writes the job summary and
  # fails on a High alert.
  zap-baseline:
    name: zap-baseline
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice title=Documentation only::The steps of this job are skipped."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # A throwaway .env for this run: fresh random values, masked in the log, never committed.
      - name: Write a throwaway .env
        if: needs.changes.outputs.code != 'false'
        run: |
          : > .env
          add() { value="$(openssl rand "$2" "$3")"; echo "::add-mask::$value"; echo "$1=$value" >> .env; }
          add ROSETTA_DB_ADMIN_PASSWORD -hex 16
          add ROSETTA_APP_DB_PASSWORD -hex 16
          add ROSETTA_MIGRATOR_DB_PASSWORD -hex 16
          add ROSETTA_SECRET_KEY -base64 32
          add ROSETTA_ADMIN_PASSWORD -hex 16
          echo "ROSETTA_ADMIN_USER=zap-admin" >> .env
      - name: Start the stack (runtime image)
        if: needs.changes.outputs.code != 'false'
        run: docker compose -f compose.yaml up -d --build --wait
      - name: Wait for /healthz
        if: needs.changes.outputs.code != 'false'
        run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/healthz
      # -I: warnings do not fail the scan; the summary step decides on the risk of each alert.
      - name: Run the ZAP baseline scan
        if: needs.changes.outputs.code != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          docker run --rm --network host --volume "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 zap-baseline.py -t http://127.0.0.1:8080 -m 2 -I -J zap-report.json
      - name: Summarise the report (fails on a High alert)
        if: needs.changes.outputs.code != 'false'
        run: node scripts/zap-summary.mjs "$RUNNER_TEMP/zap/zap-report.json"
      - name: Stack logs
        if: failure() && needs.changes.outputs.code != 'false'
        run: docker compose -f compose.yaml logs --no-color --tail 200
      - name: Remove the stack and its volumes
        if: always() && needs.changes.outputs.code != 'false'
        run: docker compose -f compose.yaml down -v --rmi local
