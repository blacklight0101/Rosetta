# Local deployment (RF-1301, environments-and-delivery.md section 9). This file holds the `db`
# service for local development and database tests; the `app` service is added by card P1-45.
# Secrets come from the git-ignored .env next to this file; nothing secret is written here.
#
#   docker compose up -d db
#
# The image is pinned by digest (postgres:17, PostgreSQL 17.11).
# The image's entrypoint creates rosetta_migrator, which owns the rosetta database, with the
# password from ROSETTA_MIGRATOR_DB_PASSWORD on the first start of an empty pgdata volume.

name: rosetta

services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: rosetta_migrator
      POSTGRES_PASSWORD: ${ROSETTA_MIGRATOR_DB_PASSWORD:?Set ROSETTA_MIGRATOR_DB_PASSWORD in .env}
      POSTGRES_DB: rosetta
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Reachable from this machine only (RNF-014).
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'rosetta_migrator', '-d', 'rosetta']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
