<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rosetta - change password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rosetta-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--rst-radius-md);font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent}
.pri{background:var(--rst-brand);color:var(--rst-brand-ink)}
.lbl{font-size:var(--rst-fs-xs);color:var(--rst-ink-muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:var(--rst-fw-label)}
.field input{height:44px;padding:0 12px;border-radius:var(--rst-radius-md);border:1px solid var(--rst-rule-strong);background:var(--rst-bg);color:var(--rst-ink);font:inherit}
.field input[aria-invalid="true"]{border-color:var(--rst-danger-solid)}
h1{margin:0;font-size:var(--rst-fs-3xl);line-height:1.1;letter-spacing:-0.02em;font-weight:700}
p{margin:0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:var(--rst-fs-sm)}
li{display:flex;gap:8px;align-items:center}
</style>
</helmet>
<div class="rst-root" data-theme="{{theme}}" style="min-height: 860px; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 24px; min-height: 68px; padding: 0 clamp(16px,4vw,64px);">
    <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Rosetta</span>
    <div style="flex: 1 1 auto;"></div>
    <span class="lbl">Signed in as <strong style="color: var(--rst-ink);">ana.ruiz</strong></span>
    <a href="SignIn.dc.html">Sign out</a>
  </header>
  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 16px 64px;">
    <form style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; padding: 32px; border-radius: var(--rst-radius-lg); background: var(--rst-surface); border: 1px solid var(--rst-rule); box-shadow: var(--rst-shadow-2);" aria-labelledby="t">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 id="t">{{heading}}</h1>
        <p style="color: var(--rst-ink-soft);">{{intro}}</p>
      </div>
      <div class="field"><label for="c">{{currentLabel}}</label><input id="c" type="password" autocomplete="current-password" value="••••••••••"></div>
      <div class="field"><label for="n">New password</label><input id="n" type="password" autocomplete="new-password" value="••••••••••" aria-invalid="true" aria-describedby="rules"></div>
      <ul id="rules" aria-label="Password rules">
        <li style="color: var(--rst-danger-ink);"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.8"></path></svg>At least 12 characters (10 so far)</li>
        <li style="color: var(--rst-ok-ink);"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg>Not on the list of common passwords</li>
        <li style="color: var(--rst-ok-ink);"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg>Does not contain your user name</li>
      </ul>
      <div class="field"><label for="r">Repeat the new password</label><input id="r" type="password" autocomplete="new-password"></div>
      <button class="btn pri" type="submit">{{submit}}</button>
      <p class="lbl">Changing your password signs you out everywhere else.</p>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"variant":{"editor":"enum","options":["first sign-in","from settings"],"default":"first sign-in"},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const first = (this.props.variant ?? 'first sign-in') === 'first sign-in';
return {
theme: this.props.theme ?? 'dark',
heading: first ? 'Choose your password' : 'Change your password',
intro: first ? 'The administrator set a temporary password. Pick your own before you continue; only you will know it.' : 'Enter your current password, then the new one.',
currentLabel: first ? 'Temporary password' : 'Current password',
submit: first ? 'Save and continue' : 'Change password'
};
}
}
</script>
</body>
</html>
