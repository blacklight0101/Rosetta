<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rosetta - sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rosetta-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--rst-radius-md);font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none}
.pri{background:var(--rst-brand);color:var(--rst-brand-ink)}
.pri:hover{background:var(--rst-brand-hover)}
.lbl{font-size:var(--rst-fs-xs);color:var(--rst-ink-muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:var(--rst-fw-label)}
.field input{height:44px;padding:0 12px;border-radius:var(--rst-radius-md);border:1px solid var(--rst-rule-strong);background:var(--rst-bg);color:var(--rst-ink);font:inherit}
.field input:focus-visible{outline:2px solid var(--rst-focus);outline-offset:1px}
h1{margin:0;font-size:var(--rst-fs-3xl);line-height:1.1;letter-spacing:-0.02em;font-weight:700}
p{margin:0}
</style>
</helmet>
<div class="rst-root" data-theme="{{theme}}" style="min-height: 860px; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 24px; min-height: 68px; padding: 0 clamp(16px,4vw,64px);">
    <a href="Landing.dc.html" style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--rst-ink); text-decoration: none;">Rosetta</a>
    <div style="flex: 1 1 auto;"></div>
    <a href="Landing.dc.html">About Rosetta</a>
  </header>
  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 16px 64px;">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; padding: 32px; border-radius: var(--rst-radius-lg); background: var(--rst-surface); border: 1px solid var(--rst-rule); box-shadow: var(--rst-shadow-2);" aria-labelledby="t">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 id="t">Sign in</h1>
        <p style="color: var(--rst-ink-soft);">Use the account the administrator created for you.</p>
      </div>
      <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--rst-radius-md); background: var(--rst-danger-bg); color: var(--rst-danger-ink); border: 1px solid var(--rst-danger-solid);">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex: none; margin-top: 2px;"><circle cx="9" cy="9" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M9 5v5M9 12.5v.4" stroke="currentColor" stroke-width="1.6"></path></svg>
          <div>{{errorText}}</div>
        </div>
      </sc-if>
      <div class="field"><label for="u">User name</label><input id="u" name="username" autocomplete="username" value="teacher"></div>
      <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" value="••••••••••••"></div>
      <button class="btn pri" type="submit">Sign in</button>
      <p class="lbl">No account? Rosetta is invite-only. Ask the administrator, or use Request access on the home page.</p>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["default","wrong"],"default":"wrong"},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.state ?? 'wrong';
// RF-1100: a locked account gets the same message as a wrong password, so the page never reveals that an account exists.
const text = 'User name or password is incorrect. (RST-2201)';
return { theme: this.props.theme ?? 'dark', showError: s !== 'default', errorText: text };
}
}
</script>
</body>
</html>
