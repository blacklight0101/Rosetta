# The shipped model list (RF-405, DEC-156): the models a role can be set to from a dropdown on the
# Default models page and in a project's model settings, for the providers that sell a fixed set of
# models. Ollama is not listed here: its models are the ones installed on the configured server.
# Every model on this list has a price in `default-prices.yaml` (Q-56; a model without one would be
# shown as "no price", RF-427). The list is the current Anthropic models, the current OpenAI
# flagships and the cheap OpenAI models a person is likely to try; the legacy models are in the
# price table, and a person can still type any model id under "Other model...". Update the version
# date when the list changes.
#
# `contextTokens` and `maxOutputTokens` (Q-57) are the context window and the maximum output of the
# provider's model page, read on 2026-10-21 (docs/providers.md 3.6 lists the pages); a model without a
# confirmed number has no field and keeps 128,000 tokens of context.
#
# `reasoning: true` (Q-58) marks a model that takes a reasoning effort on the provider's API: the
# adapter then sends the role's effort (default low) as OpenAI `reasoning_effort` or Anthropic
# `output_config.effort`; a model without the mark never gets one. Checked 2026-10-21 on
# platform.claude.com/docs/en/build-with-claude/effort (the four Anthropic models are on its list of
# supported models) and developers.openai.com/api/docs (each model page lists reasoning token
# support). gpt-6-sol and gpt-6-luna are marked too: their pages say Chat Completions takes function
# calling only with effort `none`, so a call that carries tools is sent with `none` and a call
# without tools with the role effort (probed 2026-10-23 with Rosetta's reader tools: 200 with effort
# none, HTTP 400 with no effort because OpenAI's default effort refuses tools).
#
# `noTools: true` (P3-130) marks a model that cannot call tools on Chat Completions at any effort
# (gpt-6-astra, gpt-6.1-sol: HTTP 400 "does not support 'none' with this model" and "Function tools
# with reasoning_effort are not supported"; 200 without tools at low). They are not marked
# `reasoning`. A run that gives such a model to a role that calls tools (the reader) is refused
# before any call (RST-1523); a role without tools (verifier, planner, summariser) may use it.
schemaVersion: 1
version: '2026-10-21'
