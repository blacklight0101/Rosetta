# The shipped model list (RF-405, DEC-156): the models a role can be set to from a dropdown on the
# Default models page and in a project's model settings, for the providers that sell a fixed set of
# models. Ollama is not listed here: its models are the ones installed on the configured server.
# Every model on this list has a price in `default-prices.yaml` (Q-56; a model without one would be
# shown as "no price", RF-427). The list is the current Anthropic models, the current OpenAI
# flagships and the cheap OpenAI models a person is likely to try; the legacy models are in the
# price table, and a person can still type any model id under "Other model...". Update the version
# date when the list changes.
