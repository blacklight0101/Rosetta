# The shipped price table (RF-420, DEC-54, data-model.md section 3.18): prices per million tokens in
# whole micro-dollars (1 USD = 1000000). A call with a server key is always priced from this file; a
# project's `budget.prices` overrides apply only to calls with the user's own key (DEC-107). A local
# model (Ollama) missing from this list costs zero; any other missing model is refused unless the
# project allows unpriced models with the user's own key (RF-427). Prices change: check the
# providers' pricing pages, update the entries and the version date together.
#
# Sources, checked on 2026-10-21 (docs/providers.md section 3.5, Q-56):
# - Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (base input, 5-minute cache
#   write, cache hit and output) and the model pages under https://platform.claude.com/docs/en/models/
#   for the Claude API ids. Every model available on the Claude API is listed, the legacy ones
#   included; retired models and the limited-availability Mythos models are not. Where a model page
#   gives a dated id and an alias, both are listed.
# - OpenAI: https://developers.openai.com/api/docs/pricing, Standard tier, the flagship text tables.
#   The cached input of a model whose page shows a dash is the input price (no cache discount).
#   `gpt-5-nano-2025-08-07` is not on the page; it stays because the table priced it before
#   (DEC-106), at the price of `gpt-5-nano`.
#
# `cacheWriteInputPerMillionMicros` (P2-16) is the price of the tokens a call writes to the
# provider's prompt cache. Anthropic bills it at its 5-minute cache write price, so an Anthropic
# model without it is handled like a model missing from this list (RF-427). OpenAI bills no cache
# write of its own (cached prompts are written at the input price), so its entries repeat the input
# price; Ollama models are free.
#
# `longPrompt` (Q-56) is the one tier a model may carry: the prices of a call whose input tokens
# (cache reads and writes included) are over `overInputTokens`. Claude Haiku 5.5 is priced so over
# 100,000 prompt tokens; the OpenAI flagships over 272,000.
