# Technologies the stack check and the stack records know, per layer.
# RF-609, RNF-004: part of the versioned catalogue; its name carries the version and the catalogue SHA-256 covers it.
technologies:
  - layer: language-runtime
    name: C# on .NET
    aliases:
      - c#
      - .net
      - dotnet
    traits: []
    description: A typed language and runtime with a large standard library; the usual target for ASP.NET Core.
    platform: '.NET'
  - layer: language-runtime
    name: Java
    aliases:
      - java
      - jvm
    traits: []
    description: A typed language on the JVM with a mature ecosystem for long-lived services.
    platform: Java
  - layer: language-runtime
    name: TypeScript on Node.js
    aliases:
      - typescript
      - node.js
      - node
    traits: []
    description: One typed language for server and browser code, run on Node.js.
    platform: 'Node.js'
  - layer: language-runtime
    name: Python
    aliases:
      - python
    traits: []
    description: A dynamic language with a wide library set, strong for data and scripting work.
    platform: Python
  - layer: backend-framework
    name: ASP.NET Core Minimal APIs
    aliases:
      - minimal api
      - minimal apis
    traits:
      - api-only
    description: Small HTTP endpoints without controllers; serves data, not pages.
    platform: '.NET'
  - layer: backend-framework
    name: ASP.NET Core Web API
    aliases:
      - web api
      - webapi
    traits:
      - api-only
    description: Controller-based HTTP APIs with model binding and validation; serves data, not pages.
    platform: '.NET'
  - layer: backend-framework
    name: FastAPI
    aliases:
      - fastapi
    traits:
      - api-only
    description: A Python framework for typed HTTP APIs with generated OpenAPI documents.
    platform: Python
  - layer: backend-framework
    name: ASP.NET Core MVC
    aliases:
      - asp.net core mvc
      - aspnet core mvc
    traits: []
    description: Controllers and views in one application; serves pages and, when needed, data.
    platform: '.NET'
  - layer: front-end
    name: Razor Pages
    aliases:
      - razor pages
      - razor
    traits:
      - server-rendered
    description: Page-based views rendered on the server; no separate API is needed.
    platform: '.NET'
  - layer: front-end
    name: Blazor Server
    aliases:
      - blazor server
    traits:
      - server-rendered
    description: Components rendered on the server and updated over a live connection.
    platform: '.NET'
  - layer: front-end
    name: React
    aliases:
      - react
    traits:
      - single-page
    description: A browser component library; the back end offers an API the pages call.
  - layer: front-end
    name: Angular
    aliases:
      - angular
    traits:
      - single-page
    description: A browser application framework; the back end offers an API the pages call.
  - layer: database
    name: SQL Server
    aliases:
      - sql server
      - mssql
    traits: []
    description: A relational database common in .NET estates; the closest match to a legacy SQL Server.
  - layer: database
    name: PostgreSQL
    aliases:
      - postgresql
      - postgres
    traits: []
    description: An open-source relational database with strong standards support.
  - layer: database
    name: SQLite
    aliases:
      - sqlite
    traits: []
    description: A file-based relational database; fits a small single-node system.
  - layer: data-access
    name: Entity Framework Core
    aliases:
      - entity framework
      - ef core
      - efcore
    traits: []
    description: An object-relational mapper with migrations and change tracking.
    platform: '.NET'
  - layer: data-access
    name: Dapper
    aliases:
      - dapper
    traits: []
    description: A thin mapper over plain SQL; full control of each query.
    platform: '.NET'
  - layer: data-access
    name: ADO.NET
    aliases:
      - ado.net
    traits: []
    description: The low-level .NET database API; most code, no hidden behaviour.
    platform: '.NET'
  - layer: data-access
    name: Prisma
    aliases:
      - prisma
    traits: []
    description: A typed database client for Node.js with schema migrations.
    platform: 'Node.js'
  - layer: data-access
    name: Knex.js
    aliases:
      - knex
    traits: []
    description: A SQL query builder for Node.js; plain queries with little hidden behaviour.
    platform: 'Node.js'
  - layer: testing
    name: xUnit
    aliases:
      - xunit
    traits: []
    description: A .NET test framework with constructor-per-test isolation.
    platform: '.NET'
  - layer: testing
    name: NUnit
    aliases:
      - nunit
    traits: []
    description: A .NET test framework with attribute-driven, data-driven tests.
    platform: '.NET'
  - layer: testing
    name: Vitest
    aliases:
      - vitest
    traits: []
    description: A fast test runner for TypeScript projects.
    platform: 'Node.js'
  - layer: testing
    name: pytest
    aliases:
      - pytest
    traits: []
    description: A Python test runner with fixtures and plain assertions.
    platform: Python
  - layer: hosting
    name: IIS
    aliases:
      - iis
    traits: []
    description: The Windows web server; keeps an existing Windows deployment as it is.
  - layer: hosting
    name: Docker containers
    aliases:
      - docker
      - container
      - containers
    traits: []
    description: One image that runs the same locally and on any container host.
  - layer: hosting
    name: Azure App Service
    aliases:
      - app service
      - azure
    traits: []
    description: A managed web host that removes server upkeep.
  - layer: backend-framework
    name: Fastify
    aliases:
      - fastify
    traits: []
    description: A Node.js web framework for HTTP services; serves pages or an API.
    platform: 'Node.js'
  - layer: backend-framework
    name: ASP.NET Core Razor Pages
    aliases:
      - asp.net core razor pages
    traits: []
    description: Page-based ASP.NET Core application; serves pages and, when needed, data.
    platform: '.NET'
  - layer: front-end
    name: Windows Forms on .NET
    aliases:
      - windows forms
      - winforms
    traits: []
    description: A desktop forms toolkit that runs on current .NET; the closest match to a legacy WinForms client.
    platform: '.NET'
  - layer: front-end
    name: WPF
    aliases:
      - wpf
    traits: []
    description: A desktop toolkit with XAML views and data binding on current .NET.
    platform: '.NET'
  - layer: hosting
    name: MSIX installer
    aliases:
      - msix
      - installer
    traits: []
    description: A signed Windows package that installs and updates a desktop client.
  - layer: backend-framework
    name: Spring Boot
    aliases:
      - spring boot
      - spring
    traits: []
    description: The common JVM framework for web applications and APIs.
    platform: Java
  - layer: backend-framework
    name: Django
    aliases:
      - django
    traits: []
    description: A full Python web framework with an admin site and an ORM; serves pages and, when needed, data.
    platform: Python
  - layer: front-end
    name: Blazor
    aliases:
      - blazor
    traits: []
    description: Interactive components written in C#, run on the server or in the browser through WebAssembly.
    platform: '.NET'
  - layer: front-end
    name: Thymeleaf
    aliases:
      - thymeleaf
    traits:
      - server-rendered
    description: Server-rendered templates for Spring applications; no separate API is needed.
    platform: Java
  - layer: front-end
    name: Django templates
    aliases:
      - django templates
      - django template
    traits:
      - server-rendered
    description: Server-rendered pages written as Django templates; no separate API is needed.
    platform: Python
  - layer: data-access
    name: Spring Data JPA
    aliases:
      - spring data jpa
      - spring data
      - jpa
    traits: []
    description: Repositories over JPA and Hibernate for Spring applications.
    platform: Java
  - layer: data-access
    name: MyBatis
    aliases:
      - mybatis
    traits: []
    description: SQL you write, mapped to Java objects; full control of each query.
    platform: Java
  - layer: data-access
    name: SQLAlchemy
    aliases:
      - sqlalchemy
    traits: []
    description: The common Python ORM and SQL toolkit.
    platform: Python
  - layer: testing
    name: JUnit 5
    aliases:
      - junit 5
      - junit
    traits: []
    description: The standard JVM test framework.
    platform: Java
